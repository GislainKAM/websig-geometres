<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/websig-design-system-aebc7a59-511f-4429-b016-dbfec12fd958/tokens/colors.css">
<link rel="stylesheet" href="_ds/websig-design-system-aebc7a59-511f-4429-b016-dbfec12fd958/tokens/typography.css">
<link rel="stylesheet" href="_ds/websig-design-system-aebc7a59-511f-4429-b016-dbfec12fd958/tokens/spacing.css">
<link rel="stylesheet" href="_ds/websig-design-system-aebc7a59-511f-4429-b016-dbfec12fd958/tokens/elevation.css">
<link rel="stylesheet" href="_ds/websig-design-system-aebc7a59-511f-4429-b016-dbfec12fd958/tokens/motion.css">
<link rel="stylesheet" href="_ds/websig-design-system-aebc7a59-511f-4429-b016-dbfec12fd958/tokens/base.css">
<link rel="stylesheet" href="_ds/websig-design-system-aebc7a59-511f-4429-b016-dbfec12fd958/styles.css">
<script src="_ds/websig-design-system-aebc7a59-511f-4429-b016-dbfec12fd958/_ds_bundle.js"></script>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink-100)}
a{color:var(--text-brand);text-decoration:none}
a:hover{color:var(--brand-indigo-700)}
.rev-scroll{overflow:auto;scrollbar-width:thin}
</style>
</helmet>

<div style="height:100vh;display:flex;font-family:var(--font-body);color:var(--text-body);background:var(--ink-100);overflow:hidden">

  <aside style="flex:0 0 272px;width:272px;height:100%;background:var(--surface-card);border-right:1px solid var(--border-subtle);display:flex;flex-direction:column;overflow:hidden">
    <div style="padding:var(--space-6) var(--space-5) var(--space-5);display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--border-subtle)">
      <span style="font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted);font-weight:600">Revue</span>
      <span style="font-family:var(--font-display);font-size:var(--text-md);font-weight:700;color:var(--text-strong);letter-spacing:-0.015em;line-height:1.15">Annuaire OGEC</span>
    </div>

    <div class="rev-scroll" style="flex:1;min-height:0;padding:var(--space-4) var(--space-3);display:flex;flex-direction:column;gap:4px">
      <sc-for list="{{ deviceList }}" as="d" hint-placeholder-count="3">
        <div style="{{ d.style }}" onClick="{{ d.onClick }}">
          <span style="{{ d.iconWrap }}">
            <x-import component-from-global-scope="WebsigDesignSystem_aebc7a.Icon" name="{{ d.icon }}" size="{{ 17 }}" hint-size="17px,17px"></x-import>
          </span>
          <span style="display:flex;flex-direction:column;gap:2px;min-width:0;flex:1">
            <span style="font-size:var(--text-sm);font-weight:600;line-height:1.2">{{ d.label }}</span>
            <span style="font-family:var(--font-data);font-size:10.5px;color:var(--text-faint)">{{ d.dims }}</span>
          </span>
          <span style="{{ d.rail }}"></span>
        </div>
      </sc-for>
    </div>

    <div style="padding:var(--space-5);border-top:1px solid var(--border-subtle);display:flex;flex-direction:column;gap:var(--space-4)">
      <div style="display:flex;flex-direction:column;gap:var(--space-3)">
        <span style="font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted);font-weight:600">Mode ouvert</span>
        <div style="display:flex;flex-wrap:wrap;gap:6px">
          <sc-for list="{{ modeList }}" as="m" hint-placeholder-count="4">
            <x-import component-from-global-scope="WebsigDesignSystem_aebc7a.Tag" active="{{ m.active }}" onClick="{{ m.onClick }}" hint-size="auto,28px"><span style="white-space:nowrap">{{ m.label }}</span></x-import>
          </sc-for>
        </div>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:var(--space-3)">
        <span style="font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted);font-weight:600">Échelle</span>
        <span style="font-family:var(--font-data);font-size:var(--text-xs);color:var(--text-body)">{{ zoomLabel }}</span>
      </div>
    </div>
  </aside>

  <main class="rev-scroll" style="flex:1;min-width:0;height:100%;display:flex;flex-direction:column">
    <div style="flex:0 0 auto;display:flex;align-items:baseline;gap:var(--space-4);padding:var(--space-5) var(--space-6);border-bottom:1px solid var(--border-subtle);background:var(--surface-card)">
      <span style="font-family:var(--font-display);font-size:var(--text-lg);font-weight:700;color:var(--text-strong);letter-spacing:-0.02em;line-height:1">{{ currentLabel }}</span>
      <span style="font-family:var(--font-data);font-size:var(--text-xs);color:var(--text-muted);white-space:nowrap">{{ currentDims }}</span>
      <span style="margin-left:auto;font-size:var(--text-xs);color:var(--text-muted);text-align:right;max-width:340px">{{ currentNote }}</span>
    </div>

    <div style="flex:1;min-height:0;display:grid;place-items:center;padding:var(--space-6);overflow:auto">
      <div style="{{ stageStyle }}">
        <div style="{{ frameStyle }}">
          <dc-import name="Annuaire OGEC" viewport="{{ viewport }}" start-mode="{{ startMode }}" default-lang="{{ lang }}" hint-size="100%,100%" style="width:100%;height:100%"></dc-import>
        </div>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1360,&quot;height&quot;:900},&quot;device&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;mobile&quot;,&quot;tablet&quot;,&quot;desktop&quot;],&quot;default&quot;:&quot;mobile&quot;,&quot;tsType&quot;:&quot;'mobile' | 'tablet' | 'desktop'&quot;,&quot;section&quot;:&quot;Revue&quot;},&quot;startMode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;chercher&quot;,&quot;villes&quot;,&quot;verifier&quot;,&quot;analyser&quot;],&quot;default&quot;:&quot;chercher&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Revue&quot;},&quot;defaultLang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;FR&quot;,&quot;EN&quot;],&quot;default&quot;:&quot;FR&quot;,&quot;tsType&quot;:&quot;'FR' | 'EN'&quot;,&quot;section&quot;:&quot;Revue&quot;},&quot;scale&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.02,&quot;unit&quot;:&quot;×&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Revue&quot;}}">
const DEVICES = [
  { id: 'mobile', label: 'Mobile', dims: '390 × 844', w: 390, h: 844, icon: 'smartphone', note: 'Carte plein écran + feuille à trois hauteurs' },
  { id: 'tablet', label: 'Tablette', dims: '834 × 1112', w: 834, h: 1112, icon: 'tablet', note: 'Liste à gauche, fiche en carte flottante' },
  { id: 'desktop', label: 'Desktop', dims: '1440 × 900', w: 1440, h: 900, icon: 'monitor', note: 'Trois colonnes, panneau droit au clic' }
];
const MODES = [
  { id: 'chercher', label: 'Chercher' },
  { id: 'villes', label: 'Par ville' },
  { id: 'verifier', label: 'Vérifier' },
  { id: 'analyser', label: 'Analyser' }
];

class Component extends DCLogic {
  state = { device: null, mode: null, vw: 1360, vh: 900 };

  componentDidMount() { this.fit(); window.addEventListener('resize', this.fit); }
  componentWillUnmount() { window.removeEventListener('resize', this.fit); }
  fit = () => this.setState({ vw: window.innerWidth, vh: window.innerHeight });

  get device() { return this.state.device || this.props.device || 'mobile'; }
  get mode() { return this.state.mode || this.props.startMode || 'chercher'; }

  pick = (id) => this.setState({ device: id });
  pickMode = (id) => this.setState({ mode: id });

  renderVals() {
    const id = this.device;
    const cur = DEVICES.find(d => d.id === id) || DEVICES[0];
    const availW = Math.max(320, this.state.vw - 272 - 96);
    const availH = Math.max(320, this.state.vh - 150);
    const autoZoom = Math.min(1, availW / cur.w, availH / cur.h);
    const zoom = Math.max(0.3, Math.min(1, this.props.scale ? this.props.scale : autoZoom));

    return {
      viewport: id,
      startMode: this.mode,
      lang: this.props.defaultLang || 'FR',
      currentLabel: cur.label,
      currentDims: cur.dims + ' · ' + Math.round(zoom * 100) + ' %',
      currentNote: cur.note,
      zoomLabel: Math.round(zoom * 100) + ' %',
      stageStyle: 'width:' + Math.round(cur.w * zoom) + 'px;height:' + Math.round(cur.h * zoom) + 'px;position:relative',
      frameStyle: 'width:' + cur.w + 'px;height:' + cur.h + 'px;transform:scale(' + zoom + ');transform-origin:top left;overflow:hidden;border-radius:' + (id === 'mobile' ? '18px' : '14px') + ';border:1px solid var(--border-subtle);background:var(--surface-card);box-shadow:var(--shadow-lg)',
      deviceList: DEVICES.map(d => {
        const act = d.id === id;
        return {
          label: d.label, dims: d.dims, icon: d.icon, onClick: () => this.pick(d.id),
          style: 'position:relative;display:flex;align-items:center;gap:var(--space-3);padding:11px var(--space-3) 11px calc(var(--space-3) - 3px);border-left:3px solid ' + (act ? 'var(--brand-indigo-600)' : 'transparent') + ';background:' + (act ? 'var(--surface-brand-soft)' : 'transparent') + ';border-radius:var(--radius-sm);cursor:pointer;color:' + (act ? 'var(--text-brand)' : 'var(--text-body)') + ';transition:background-color var(--dur-fast) var(--ease-out)',
          iconWrap: 'display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;flex:0 0 auto;border-radius:var(--radius-sm);background:' + (act ? 'var(--white)' : 'var(--ink-50)') + ';border:1px solid ' + (act ? 'var(--border-brand)' : 'var(--border-subtle)'),
          rail: 'display:none'
        };
      }),
      modeList: MODES.map(m => ({ label: m.label, active: m.id === this.mode, onClick: () => this.pickMode(m.id) }))
    };
  }
}
</script>
</body>
</html>
